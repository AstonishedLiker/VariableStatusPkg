name: Build EDK2 Package

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture'
        required: true
        default: 'X64'
        type: choice
        options:
          - X64
          - IA32
          - AARCH64
          - ARM
      release_type:
        description: 'Build target'
        required: true
        default: 'RELEASE'
        type: choice
        options:
          - RELEASE
          - DEBUG
          - NOOPT
      toolchain:
        description: 'Build Toolchain'
        required: true
        default: 'GCC'
        type: choice
        options:
          - VS2019
          - VS2022
          - VS2026
          - GCCNOLTO
          - GCC
          - CLANGPDB
          - CLANGDWARF
      edk2_release_tag:
        description: 'EDK2 release tag (e.g. edk2-stable202608)'
        required: true
        default: 'edk2-stable202608'
        type: string

env:
  PACKAGE_NAME: VariableStatusPkg
  DSC_NAME: VariableStatusPkg

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout driver source
        uses: actions/checkout@v4
        with:
          path: driver-src

      - name: Clone EDK2 at release tag
        run: |
          git clone --depth 1 --branch "${{ inputs.edk2_release_tag }}" https://github.com/tianocore/edk2.git

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev iasl nasm python3 python3-distutils

      - name: Copy driver into EDK2 tree
        run: |
          cp -r driver-src edk2/${{ env.PACKAGE_NAME }}

      - name: Set up EDK2 environment
        working-directory: edk2
        run: |
          make -C BaseTools
          source edksetup.sh BaseTools

      - name: Build package
        working-directory: edk2
        run: |
          source edksetup.sh BaseTools
          build -p ${{ env.PACKAGE_NAME }}/${{ env.DSC_NAME }}.dsc -a ${{ inputs.arch }} -t ${{ inputs.toolchain }} -b ${{ inputs.release_type }}

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}-${{ inputs.arch }}-${{ inputs.release_type }}-${{ inputs.toolchain }}
          path: edk2/Build/${{ env.DSC_NAME }}/${{ inputs.release_type }}_${{ inputs.toolchain }}/${{ inputs.arch }}/*.efi