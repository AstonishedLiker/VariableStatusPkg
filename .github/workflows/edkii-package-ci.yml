name: Build EDK2 Package

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture'
        required: true
        default: 'X64'
        type: choice
        options:
          - X64
          - IA32
          - AARCH64
          - ARM
      release_type:
        description: 'Build target'
        required: true
        default: 'RELEASE'
        type: choice
        options:
          - RELEASE
          - DEBUG
          - NOOPT
      toolchain:
        description: 'Build Toolchain'
        required: true
        default: 'GCC'
        type: choice
        options:
          - VS2019
          - VS2022
          - VS2026
          - GCCNOLTO
          - GCC
          - CLANGPDB
          - CLANGDWARF
      edk2_release_tag:
        description: 'EDK2 release tag (e.g. edk2-stable202608)'
        required: true
        default: 'edk2-stable202608'
        type: string
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  PACKAGE_NAME: VariableStatusPkg
  DSC_NAME: VariableStatusPkg
  DEFAULT_ARCH: X64
  DEFAULT_RELEASE_TYPE: RELEASE
  DEFAULT_TOOLCHAIN: GCC
  DEFAULT_EDK2_TAG: edk2-stable202608

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout driver source
        uses: actions/checkout@v4
        with:
          path: driver-src

      - name: Resolve build parameters
        id: params
        run: |
          echo "arch=${{ inputs.arch || env.DEFAULT_ARCH }}" >> "$GITHUB_OUTPUT"
          echo "release_type=${{ inputs.release_type || env.DEFAULT_RELEASE_TYPE }}" >> "$GITHUB_OUTPUT"
          echo "toolchain=${{ inputs.toolchain || env.DEFAULT_TOOLCHAIN }}" >> "$GITHUB_OUTPUT"
          echo "edk2_tag=${{ inputs.edk2_release_tag || env.DEFAULT_EDK2_TAG }}" >> "$GITHUB_OUTPUT"

      - name: Cache EDK2 clone with submodules
        id: cache-edk2
        uses: actions/cache@v4
        with:
          path: edk2
          key: edk2-${{ steps.params.outputs.edk2_tag }}-${{ runner.os }}

      - name: Clone EDK2 at release tag
        if: steps.cache-edk2.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${{ steps.params.outputs.edk2_tag }}" https://github.com/tianocore/edk2.git
          cd edk2
          git submodule update --init --recursive --depth 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev iasl nasm python3 python3-setuptools

      - name: Cache BaseTools build
        uses: actions/cache@v4
        with:
          path: |
            edk2/BaseTools/Source/C/bin
            edk2/BaseTools/Source/C/*/OUTPUT
          key: basetools-${{ steps.params.outputs.edk2_tag }}-${{ runner.os }}-${{ hashFiles('edk2/BaseTools/Source/C/**') }}

      - name: Copy driver into EDK2 tree
        run: |
          rm -rf edk2/${{ env.PACKAGE_NAME }}
          cp -r driver-src edk2/${{ env.PACKAGE_NAME }}

      - name: Set up EDK2 environment
        working-directory: edk2
        run: |
          make -C BaseTools
          source edksetup.sh BaseTools

      - name: Build package
        working-directory: edk2
        run: |
          source edksetup.sh BaseTools
          build -p ${{ env.PACKAGE_NAME }}/${{ env.DSC_NAME }}.dsc -a ${{ steps.params.outputs.arch }} -t ${{ steps.params.outputs.toolchain }} -b ${{ steps.params.outputs.release_type }}

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}-${{ steps.params.outputs.arch }}-${{ steps.params.outputs.release_type }}-${{ steps.params.outputs.toolchain }}
          path: edk2/Build/${{ env.DSC_NAME }}/${{ steps.params.outputs.release_type }}_${{ steps.params.outputs.toolchain }}/${{ steps.params.outputs.arch }}/*.efi